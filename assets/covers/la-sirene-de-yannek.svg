<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="MyTune album artwork">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="600" height="600" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="600" fill="#123B3A"/>
    <g stroke="#F6EFE3" stroke-width="7" fill="none" opacity="0.85">
      <path d="M0 200 Q75 160 150 200 T300 200 T450 200 T600 200"/>
      <path d="M0 260 Q75 220 150 260 T300 260 T450 260 T600 260"/>
      <path d="M0 320 Q75 280 150 320 T300 320 T450 320 T600 320"/>
    </g>
    <circle cx="430" cy="150" r="70" fill="#D98E4A"/>
  </g>
  <g filter="url(#grain)"><rect width="600" height="600" fill="none"/></g>
  <text x="34" y="566" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#0E3B3E" opacity="0.72">MYTUNE</text>
  <text x="566" y="566" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#0E3B3E" opacity="0.55">NO. 04</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="MyTune album artwork">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="600" height="600" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="600" fill="#F6EFE3"/>
    <path d="M300 120 C420 180 420 300 300 480 C180 300 180 180 300 120 Z" fill="#7C7A3F"/>
    <path d="M300 120 L300 480" stroke="#0E3B3E" stroke-width="6"/>
    <path d="M300 200 L360 260 M300 200 L240 260 M300 300 L380 360 M300 300 L220 360" stroke="#0E3B3E" stroke-width="5" fill="none"/>
    <circle cx="300" cy="120" r="20" fill="#D98E4A"/>
  </g>
  <g filter="url(#grain)"><rect width="600" height="600" fill="none"/></g>
  <text x="34" y="566" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#0E3B3E" opacity="0.72">MYTUNE</text>
  <text x="566" y="566" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#0E3B3E" opacity="0.55">NO. 13</text>
</svg>

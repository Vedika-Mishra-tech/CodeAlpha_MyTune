<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="MyTune album artwork">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="600" height="600" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="600" fill="#F3E9D6"/>
    <circle cx="300" cy="250" r="150" fill="#D98E4A"/>
    <rect x="0" y="330" width="600" height="26" fill="#0E3B3E"/>
    <rect x="0" y="366" width="600" height="10" fill="#7C7A3F"/>
    <rect x="0" y="386" width="600" height="6" fill="#0E3B3E" opacity="0.5"/>
    <path d="M0 470 Q150 410 300 470 T600 470" fill="none" stroke="#0E3B3E" stroke-width="8"/>
  </g>
  <g filter="url(#grain)"><rect width="600" height="600" fill="none"/></g>
  <text x="34" y="566" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#0E3B3E" opacity="0.72">MYTUNE</text>
  <text x="566" y="566" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#0E3B3E" opacity="0.55">NO. 01</text>
</svg>
